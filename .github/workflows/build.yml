name: Build watch face
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate watchface.xml (Google's Watch Face Format validator)
        run: |
          git clone --depth 1 https://github.com/google/watchface /tmp/wff
          V=/tmp/wff/third_party/wff/specification
          mkdir -p /tmp/v && javac -cp "$V/validator/libs/*" -d /tmp/v $(find $V/validator/src -name "*.java")
          (cd $V/documents && zip -qr /tmp/v/docs.zip .)
          java -cp "/tmp/v:$V/validator/libs/*" com.samsung.watchface.DWFValidationApplication 2 \
            watchface/src/main/res/raw/watchface.xml 2>&1 | tee v.log
          grep -q "PASSED" v.log || { grep SEVERE v.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "error:|e: |FAILURE|What went wrong|ERROR" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AstroWatchFace-apk
          path: |
            watchface/build/outputs/apk/release/*.apk
            companion/build/outputs/apk/release/*.apk
      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          cp watchface/build/outputs/apk/release/*.apk AstroWatchFace.apk
          cp companion/build/outputs/apk/release/*.apk AstroCompanion.apk
          printf 'build=%s\n%s\n' "$GITHUB_RUN_NUMBER" "$MSG" > notes.txt
          R=${{ github.repository }}
          if gh release view latest -R "$R" >/dev/null 2>&1; then
            gh release upload latest AstroWatchFace.apk AstroCompanion.apk --clobber -R "$R"
            gh release edit latest --notes-file notes.txt -R "$R"
          else
            gh release create latest AstroWatchFace.apk AstroCompanion.apk --title "Latest build" --notes-file notes.txt -R "$R"
          fi
